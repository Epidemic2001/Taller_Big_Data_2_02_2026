# Herramientas de ingesta - Big Data en Sismología
#
# Cada herramienta tiene su perfil, para levantarlas de a una (juntas usan ~7 GB de RAM):
#   docker compose --profile kafka   up -d     -> Kafka + Kafka UI      http://localhost:8081
#   docker compose --profile nifi    up -d     -> Apache NiFi           https://localhost:8443/nifi
#   docker compose --profile airflow up -d     -> Apache Airflow        http://localhost:8080
#   docker compose --profile spark   up -d     -> Spark Streaming       http://localhost:4040
#   docker compose --profile lambda  up -d     -> AWS Lambda + S3 (LocalStack)  http://localhost:4566
# Detener:  docker compose --profile <perfil> down
#
# La carpeta del proyecto se monta en /opt/sismo dentro de los contenedores, así que todo
# lo que las herramientas escriben aparece en .\datos en Windows.

services:

  # ------------------------------------------------------------------ KAFKA (EMSC Streaming)
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["kafka"]
    container_name: sismo-kafka
    ports:
      - "9092:9092"            # para el productor que corre en Windows (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["kafka"]
    container_name: sismo-kafka-ui
    depends_on: [kafka]
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sismologia
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  # ------------------------------------------------------------------ NIFI (CSN Chile)
  nifi:
    image: apache/nifi:2.0.0
    profiles: ["nifi"]
    container_name: sismo-nifi
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: sismologia2026     # mínimo 12 caracteres
      NIFI_JVM_HEAP_INIT: 1g
      NIFI_JVM_HEAP_MAX: 2g
    volumes:
      - ./datos:/opt/sismo/datos

  # ------------------------------------------------------------------ AIRFLOW (USGS Catálogo)
  airflow:
    build: ./herramientas/airflow
    profiles: ["airflow"]
    container_name: sismo-airflow
    ports:
      - "8080:8080"
    environment:
      SISMO_HOME: /opt/sismo
      AIRFLOW__CORE__DAGS_FOLDER: /opt/sismo/herramientas/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "15"
    volumes:
      - .:/opt/sismo
    command: >
      bash -c "airflow db migrate &&
               (airflow users create --username admin --password sismologia --firstname Equipo
                 --lastname Sismologia --role Admin --email equipo@usm.cl || true) &&
               (airflow scheduler &) &&
               exec airflow webserver --port 8080"

  # ------------------------------------------------------------------ SPARK (EMSC LastQuake)
  spark:
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    profiles: ["spark"]
    container_name: sismo-spark
    user: root
    ports:
      - "4040:4040"            # Spark UI, pestaña "Structured Streaming"
    environment:
      PYTHONPATH: /opt/sismo
    volumes:
      - .:/opt/sismo
    working_dir: /opt/sismo
    command: >
      /opt/spark/bin/spark-submit --master local[2] --conf spark.ui.port=4040
      /opt/sismo/fuentes/emsc_lastquake/job_spark.py

  # ------------------------------------------------------------------ LAMBDA + S3 (USGS ShakeMap)
  # LocalStack emula AWS en tu computador. La versión 4.12 es la última que funciona sin cuenta;
  # si no arranca, crea una cuenta gratuita en localstack.cloud y define LOCALSTACK_AUTH_TOKEN.
  localstack:
    image: localstack/localstack:4.12
    profiles: ["lambda"]
    container_name: sismo-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,lambda,iam,logs,sts
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # LocalStack ejecuta cada Lambda en un contenedor
