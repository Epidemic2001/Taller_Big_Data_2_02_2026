# Herramientas de ingesta - Big Data en Sismología
#
# Cada herramienta tiene su perfil, para levantarlas de a una (juntas usan ~7 GB de RAM):
#   docker compose --profile kafka   up -d     -> Kafka + Kafka UI      http://localhost:8081
#                                                 + MongoDB + Mongo Express  http://localhost:8082
#   docker compose --profile mongo   up -d     -> solo MongoDB + Mongo Express (consultar lo guardado)
#   docker compose --profile nifi    up -d     -> Apache NiFi           https://localhost:8443/nifi
#                                                 + MinIO (data lake)   http://localhost:9003
#   docker compose --profile datalake up -d    -> solo el MinIO del data lake (consultar lo guardado)
#   docker compose --profile airflow up -d     -> Apache Airflow        http://localhost:8080
#                                                 + MinIO (lakehouse)   http://localhost:9001
#                                                 + catálogo REST de Apache Iceberg  http://localhost:8181
#   docker compose --profile lakehouse up -d   -> solo MinIO + catálogo Iceberg (consultar lo guardado)
#   docker compose --profile spark   up -d     -> Spark Streaming       http://localhost:4040
#                                                 + ClickHouse (data warehouse)  http://localhost:8123/play
#   docker compose --profile warehouse up -d   -> solo ClickHouse (consultar lo guardado)
#   docker compose --profile lambda  up -d     -> AWS Lambda + S3 (LocalStack)  http://localhost:4566
# Detener:  docker compose --profile <perfil> down
#
# La carpeta del proyecto se monta en /opt/sismo dentro de los contenedores, así que todo
# lo que las herramientas escriben aparece en .\datos en Windows.

# Configuración común de los dos MinIO (data lake del CSN y lakehouse del USGS).
# MinIO dejó de publicar sus imágenes oficiales en 2025; pgsty/minio es una compilación comunitaria
# del mismo código fuente de MinIO.
x-minio: &minio
  image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
  environment:
    MINIO_ROOT_USER: admin
    MINIO_ROOT_PASSWORD: sismologia2026
  command: server /data --console-address ":9001"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    interval: 5s
    timeout: 5s
    retries: 10

services:

  # ------------------------------------------------------------------ KAFKA (EMSC Streaming)
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["kafka"]
    container_name: sismo-kafka
    ports:
      - "9092:9092"            # para el productor que corre en Windows (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["kafka"]
    container_name: sismo-kafka-ui
    depends_on: [kafka]
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sismologia
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  # ------------------------------------------------------------------ MONGODB (almacenamiento EMSC Streaming)
  # Base NoSQL donde el consumidor de Kafka guarda las alertas EMSC. Está en el perfil "kafka" para
  # levantarse junto al tópico, y en "mongo" para consultar lo guardado sin prender Kafka.
  # Los datos viven en el volumen "mongo-datos": sobreviven a "down" y solo se borran con "down -v".
  mongodb:
    image: mongo:8.0
    profiles: ["kafka", "mongo"]
    container_name: sismo-mongodb
    ports:
      - "27017:27017"          # para el consumidor que corre en Windows (localhost:27017)
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: sismologia
    command: ["--wiredTigerCacheSizeGB", "0.5"]   # por defecto tomaría casi la mitad de la RAM de Docker
    volumes:
      - mongo-datos:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express:1.0.2
    profiles: ["kafka", "mongo"]
    container_name: sismo-mongo-express
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:sismologia@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: sismologia

  # ------------------------------------------------------------------ NIFI (CSN Chile)
  nifi:
    image: apache/nifi:2.0.0
    profiles: ["nifi"]
    container_name: sismo-nifi
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: sismologia2026     # mínimo 12 caracteres
      NIFI_JVM_HEAP_INIT: 1g
      NIFI_JVM_HEAP_MAX: 2g
    volumes:
      - ./datos:/opt/sismo/datos

  # ------------------------------------------------------------------ DATA LAKE (almacenamiento CSN Chile)
  # MinIO on-premise propio del data lake: NiFi deja aquí cada miniSEED (bucket "raw") y el curado
  # con ObsPy escribe los tensores Zarr para Deep Learning (bucket "curated"). Es una instancia aparte
  # del MinIO del lakehouse para que cada perfil se levante y se borre (down -v) por separado.
  minio-datalake:
    <<: *minio
    profiles: ["nifi", "datalake"]
    container_name: sismo-minio-datalake
    ports:
      - "9002:9000"            # API S3 (desde Windows: localhost:9002; desde NiFi: minio-datalake:9000)
      - "9003:9001"            # consola web
    volumes:
      - datalake-datos:/data

  # Crea los buckets al levantar el perfil y termina. "raw" tiene versionado: si un miniSEED se vuelve
  # a escribir, la versión anterior se conserva (zona cruda inmutable).
  datalake-buckets:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    profiles: ["nifi", "datalake"]
    container_name: sismo-datalake-buckets
    depends_on:
      minio-datalake:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set dl http://minio-datalake:9000 admin sismologia2026 &&
             mc mb --ignore-existing --with-versioning dl/raw &&
             mc mb --ignore-existing dl/curated"

  # ------------------------------------------------------------------ AIRFLOW (USGS Catálogo)
  airflow:
    build: ./herramientas/airflow
    profiles: ["airflow"]
    container_name: sismo-airflow
    ports:
      - "8080:8080"
    environment:
      SISMO_HOME: /opt/sismo
      AIRFLOW__CORE__DAGS_FOLDER: /opt/sismo/herramientas/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "15"
      LAKEHOUSE_S3_ENDPOINT: http://minio:9000           # desde Windows son localhost:9000 y :8181
      LAKEHOUSE_CATALOGO_URI: http://iceberg-rest:8181
    volumes:
      - .:/opt/sismo
    command: >
      bash -c "airflow db migrate &&
               (airflow users create --username admin --password sismologia --firstname Equipo
                 --lastname Sismologia --role Admin --email equipo@usm.cl || true) &&
               (airflow scheduler &) &&
               exec airflow webserver --port 8080"

  # ------------------------------------------------------------------ DATA LAKEHOUSE (almacenamiento USGS Catálogo)
  # MinIO guarda los archivos (QuakeML bronze y los Parquet + metadatos de las tablas Iceberg) y el
  # catálogo REST de Iceberg registra qué tablas existen y cuál es su versión (snapshot) vigente.
  # Están en el perfil "airflow" para levantarse con el DAG, y en "lakehouse" para consultar sin Airflow.
  # Los datos viven en los volúmenes "minio-datos" e "iceberg-catalogo": solo "down -v" los borra.
  minio:
    <<: *minio
    profiles: ["airflow", "lakehouse"]
    container_name: sismo-minio
    ports:
      - "9000:9000"            # API S3 (la usan PyIceberg y el catálogo)
      - "9001:9001"            # consola web
    volumes:
      - minio-datos:/data

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    profiles: ["airflow", "lakehouse"]
    container_name: sismo-iceberg-rest
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:/home/iceberg/catalogo.db   # registro de tablas, persistido en el volumen
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: sismologia2026
      AWS_REGION: us-east-1
    volumes:
      - iceberg-catalogo:/home/iceberg

  # ------------------------------------------------------------------ SPARK (EMSC LastQuake)
  spark:
    build: ./herramientas/spark          # imagen oficial + driver JDBC de ClickHouse
    profiles: ["spark"]
    container_name: sismo-spark
    user: root
    depends_on:
      clickhouse:
        condition: service_healthy     # el esquema estrella ya existe cuando Spark empieza a cargar
    ports:
      - "4040:4040"            # Spark UI, pestaña "Structured Streaming"
    environment:
      PYTHONPATH: /opt/sismo
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/sismologia
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: sismologia
    volumes:
      - .:/opt/sismo
    working_dir: /opt/sismo
    command: >
      /opt/spark/bin/spark-submit --master local[2] --conf spark.ui.port=4040
      /opt/sismo/fuentes/emsc_lastquake/job_spark.py

  # ------------------------------------------------------------------ DATA WAREHOUSE (almacenamiento EMSC LastQuake)
  # ClickHouse: base OLAP columnar con el modelo estrella de los testimonios. Al arrancar ejecuta
  # herramientas/clickhouse/esquema.sql (todo IF NOT EXISTS). Está en el perfil "spark" para recibir
  # los micro-batches, y en "warehouse" para consultar sin Spark. El puerto 8123 sirve las consultas
  # HTTP, el JDBC de Spark y un editor SQL web en /play.
  # Los datos viven en el volumen "clickhouse-datos": solo "down -v" los borra.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    profiles: ["spark", "warehouse"]
    container_name: sismo-clickhouse
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: sismologia
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "true"   # aplica el esquema también si el volumen ya existe
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - clickhouse-datos:/var/lib/clickhouse
      - ./herramientas/clickhouse/esquema.sql:/docker-entrypoint-initdb.d/esquema.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "admin", "--password", "sismologia",
             "--query", "EXISTS TABLE sismologia.fact_felt_reports"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------------------ LAMBDA + S3 (USGS ShakeMap)
  # LocalStack emula AWS en tu computador. La versión 4.12 es la última que funciona sin cuenta;
  # si no arranca, crea una cuenta gratuita en localstack.cloud y define LOCALSTACK_AUTH_TOKEN.
  localstack:
    image: localstack/localstack:4.12
    profiles: ["lambda"]
    container_name: sismo-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,lambda,iam,logs,sts
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # LocalStack ejecuta cada Lambda en un contenedor

volumes:
  mongo-datos:
  minio-datos:
  iceberg-catalogo:
  datalake-datos:
  clickhouse-datos:
