# Servicios de CONSUMO - Big Data en Sismología
#
# Este archivo se suma al docker-compose.yml principal (no lo modifica):
#
#   docker compose -f docker-compose.yml -f docker-compose.consumo.yml --profile <perfil> [--profile <perfil>] up -d
#
#   Consumo 1 (alertas):   --profile kafka --profile alertas      -> Mailpit http://localhost:8025
#                          (o --profile mongo --profile alertas si ya hay sismos guardados en MongoDB)
#   Consumo 2 (dashboard): --profile warehouse --profile dashboard -> Grafana http://localhost:3000
#                          (o --profile spark --profile dashboard para ver llegar los testimonios en vivo)
#
# Detener:  docker compose -f docker-compose.yml -f docker-compose.consumo.yml --profile <perfil> down
# Los datos de ClickHouse y MongoDB viven en sus volúmenes y sobreviven a "down"; solo "down -v" los borra.

services:

  # ------------------------------------------------------------------ CONSUMO 1: ALERTAS (correo)
  # Mailpit recibe los correos que envía consumo/alertas/alertas.py (SMTP 1025) y los muestra en una
  # bandeja web (8025). No sale ningún correo real: sirve para demostrar el canal sin cuentas externas.
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["alertas", "consumo"]
    container_name: sismo-mailpit
    ports:
      - "8025:8025"            # bandeja web
      - "1025:1025"            # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  # ------------------------------------------------------------------ CONSUMO 2: DASHBOARD (BI)
  # Grafana con el plugin oficial de ClickHouse. El datasource y el dashboard se cargan solos desde
  # consumo/dashboard/grafana (provisioning), así que no hay que configurar nada a mano.
  # Usuario de edición: admin / sismologia. Cualquiera puede ver el dashboard sin iniciar sesión.
  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["dashboard", "consumo"]
    container_name: sismo-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: sismologia
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sismologia.json
    volumes:
      - grafana-datos:/var/lib/grafana
      - ./consumo/dashboard/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./consumo/dashboard/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  grafana-datos:
